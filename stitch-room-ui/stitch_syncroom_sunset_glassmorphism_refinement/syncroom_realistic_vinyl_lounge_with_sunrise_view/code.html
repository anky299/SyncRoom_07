<!-- Custom Audiophile Engineering Styles -->
<style data-purpose="custom-styling">
    /* Handcrafted Walnut/Ebony Layered Plinth with Precision Bevel & Bronze Sub-chassis */
    .audiophile-plinth {
      background: 
        radial-gradient(ellipse at 30% 20%, rgba(138, 77, 41, 0.45) 0%, rgba(42, 23, 14, 0.95) 55%, #120905 100%),
        repeating-linear-gradient(112deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 6px),
        linear-gradient(145deg, #2b170c 0%, #150b06 60%, #0a0503 100%);
      box-shadow: 
        0 40px 80px -15px rgba(0, 0, 0, 0.92),
        0 20px 40px -10px rgba(0, 0, 0, 0.8),
        inset 0 1px 1px rgba(255, 200, 140, 0.35),
        inset 0 0 0 1.5px rgba(80, 48, 28, 0.8),
        inset -1px -1px 3px rgba(0, 0, 0, 0.9),
        0 0 50px rgba(235, 120, 45, 0.12);
      border-radius: 36px;
    }

    /* Recessed Platter Well with Brushed Dark Bronze Flange */
    .recessed-platter-well {
      background: radial-gradient(circle at center, #050302 45%, #190f09 88%, #2d1b11 100%);
      box-shadow: 
        inset 0 12px 28px rgba(0, 0, 0, 0.96),
        inset 0 0 12px rgba(0, 0, 0, 0.9),
        0 1px 1px rgba(255, 255, 255, 0.1),
        0 0 0 2px rgba(60, 36, 22, 0.7);
    }

    /* Heavy CNC Anodized Aluminum Platter with Strobe Dot Calibration Rim */
    .audiophile-aluminum-platter {
      background: 
        repeating-conic-gradient(from 0deg at 50% 50%, #443c37 0deg, #1f1b19 4deg, #443c37 8deg),
        radial-gradient(circle at center, #1b1613 60%, #2e2823 85%, #635b54 99%, #8a7e74 100%);
      box-shadow: 
        0 8px 24px rgba(0,0,0,0.85),
        0 0 0 3px #181310,
        0 0 0 4.5px rgba(214, 163, 115, 0.45);
    }

    /* Damped Antistatic Matte Silicone/Rubber Slipmat */
    .damping-mat {
      background: radial-gradient(circle at center, 
        #110d0a 0%, 
        #17120e 45%, 
        #100b08 85%, 
        #0b0806 100%
      );
      box-shadow: inset 0 0 16px rgba(0,0,0,0.92);
    }

    /* Ultra-Realistic Audiophile Obsidian Microgroove Record */
    .vinyl-grooves-ultra {
      background: radial-gradient(circle at center,
        #1b130e 0%,
        #0a0705 18%,
        #1c140f 19%,
        #070503 21%,
        #17110c 24%,
        #090604 26%,
        #1a130e 30%,
        #0b0805 32%,
        #221811 36%,
        #070504 38%,
        #19120d 42%,
        #0a0705 45%,
        #211710 50%,
        #070504 53%,
        #1b130e 58%,
        #0a0705 61%,
        #231911 67%,
        #060403 70%,
        #1c130d 76%,
        #080504 79%,
        #221811 86%,
        #070504 89%,
        #1a120c 95%,
        #050302 100%
      );
      box-shadow: 
        inset 0 0 25px rgba(0,0,0,0.95), 
        0 18px 45px rgba(0, 0, 0, 0.9), 
        0 0 45px rgba(243, 142, 58, 0.2);
    }

    /* Holographic Dual Anisotropic Sunburst Light Sheen catching golden hour rays */
    .vinyl-anisotropic-sheen {
      background: conic-gradient(
        from 28deg at 50% 50%,
        rgba(255, 230, 200, 0.22) 0deg,
        rgba(255, 170, 100, 0.04) 22deg,
        rgba(255, 255, 255, 0) 55deg,
        rgba(255, 180, 110, 0.08) 120deg,
        rgba(255, 240, 215, 0.25) 180deg,
        rgba(255, 160, 90, 0.04) 205deg,
        rgba(255, 255, 255, 0) 240deg,
        rgba(255, 190, 120, 0.08) 305deg,
        rgba(255, 230, 200, 0.22) 360deg
      );
      mix-blend-mode: screen;
    }

    /* Precision Brushed Metal / Titanium Tonearm Stem */
    .titanium-wand {
      background: linear-gradient(90deg, #5c554e 0%, #d8d3cb 35%, #f4efe8 55%, #8f877e 85%, #383430 100%);
      box-shadow: -2px 6px 14px rgba(0,0,0,0.7);
    }

    /* Solid Brass Isolation Foot & Screws */
    .brass-accent {
      background: radial-gradient(circle at 35% 30%, #ffe9b8 0%, #dca249 50%, #7e5518 90%, #462c08 100%);
      box-shadow: 0 2px 6px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.6);
    }

    /* Unified Glassmorphism Surface Style for Panels and Bar */
    .lounge-glass {
      background: rgba(18, 10, 6, 0.72);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      border: 1px solid rgba(255, 195, 140, 0.12);
      box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.82), 0 0 1px 1px rgba(255, 255, 255, 0.05) inset;
    }

    /* Vinyl Continuous Rotation */
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-vinyl {
      animation: spinDisc 22s linear infinite;
    }

    /* Realistic Mechanical Tonearm Dynamics: Lift & Sweep */
    #tonearmAssemblyInner {
      transform-origin: 38px 38px;
      transition: transform 1.25s cubic-bezier(0.34, 1.15, 0.64, 1), filter 0.8s ease;
    }

    /* Playing state (default) */
    .is-playing #vinylDisc {
      animation-play-state: running;
    }
    .is-playing #tonearmAssemblyInner {
      transform: rotate(27.5deg) scale(1);
      filter: drop-shadow(-8px 14px 12px rgba(0,0,0,0.7));
    }
    .is-playing #stylusLightGlow {
      opacity: 1;
      box-shadow: 0 0 12px 3px rgba(255, 175, 75, 0.9);
    }
    .is-playing #playIcon {
      display: none;
    }
    .is-playing #pauseIcon {
      display: block;
    }

    /* Paused state (Tonearm lifts up and parks in rest post) */
    .is-paused #vinylDisc {
      animation-play-state: paused;
    }
    .is-paused #tonearmAssemblyInner {
      transform: rotate(-1.5deg) scale(1.02); /* slightly lifted in 3D perspective */
      filter: drop-shadow(-14px 22px 18px rgba(0,0,0,0.85));
    }
    .is-paused #stylusLightGlow {
      opacity: 0.15;
      box-shadow: none;
    }
    .is-paused #playIcon {
      display: block;
    }
    .is-paused #pauseIcon {
      display: none;
    }

    /* Custom thin scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(243, 142, 58, 0.45);
    }

    /* Smooth Drawer Slide */
    .panel-drawer {
      transition: all 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .panel-collapsed {
      max-width: 0 !important;
      width: 0 !important;
      opacity: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      border-width: 0 !important;
      overflow: hidden !important;
      pointer-events: none;
      transform: scaleX(0.92) translateX(24px);
    }
    .panel-expanded {
      opacity: 1 !important;
      transform: scaleX(1) translateX(0);
      pointer-events: auto;
    }
  </style>
</head>

<!-- Interactive State JavaScript: Turntable Controls & Responsive Dynamic Layout Shifting -->
<script>
  (function initListeningRoom() {
    const app = document.getElementById('roomApp');
    const playPauseBtn = document.getElementById('playPauseButton');
    const turntableArea = document.getElementById('turntableInteractiveArea');

    // Playback Toggle
    function togglePlayback(e) {
      if (e) e.stopPropagation();
      if (app.classList.contains('is-playing')) {
        app.classList.remove('is-playing');
        app.classList.add('is-paused');
      } else {
        app.classList.remove('is-paused');
        app.classList.add('is-playing');
      }
    }

    if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlayback);
    if (turntableArea) turntableArea.addEventListener('click', togglePlayback);

    // Sidebar View Navigation & Layout Shifting
    const navBtnRoom = document.getElementById('navBtnRoom');
    const navBtnQueue = document.getElementById('navBtnQueue');
    const navBtnChat = document.getElementById('navBtnChat');
    const navBtnDJ = document.getElementById('navBtnDJ');

    const panelChat = document.getElementById('panelChat');
    const panelQueue = document.getElementById('panelQueue');
    const closeChatBtn = document.getElementById('closeChatBtn');
    const closeQueueBtn = document.getElementById('closeQueueBtn');

    const allNavButtons = [navBtnRoom, navBtnQueue, navBtnChat, navBtnDJ];

    const activeNavClass = ['bg-gradient-to-b', 'from-[#4a2414]', 'to-[#241209]', 'border', 'border-orange-500/50', 'text-amberGlow', 'shadow-[0_0_18px_rgba(243,142,58,0.35)]'];
    const inactiveNavClass = ['text-stone-400'];

    function setNavButtonActive(targetBtn) {
      allNavButtons.forEach(btn => {
        if (!btn) return;
        if (btn === targetBtn) {
          btn.classList.add(...activeNavClass);
          btn.classList.remove(...inactiveNavClass);
        } else {
          btn.classList.remove(...activeNavClass);
          btn.classList.add(...inactiveNavClass);
        }
      });
    }

    function showPanels(showChat, showQueue) {
      if (panelChat) {
        if (showChat) {
          panelChat.classList.remove('panel-collapsed');
          panelChat.classList.add('panel-expanded');
        } else {
          panelChat.classList.remove('panel-expanded');
          panelChat.classList.add('panel-collapsed');
        }
      }

      if (panelQueue) {
        if (showQueue) {
          panelQueue.classList.remove('panel-collapsed');
          panelQueue.classList.add('panel-expanded');
        } else {
          panelQueue.classList.remove('panel-expanded');
          panelQueue.classList.add('panel-collapsed');
        }
      }
    }

    function applyState(view) {
      if (view === 'home') {
        showPanels(false, false);
        setNavButtonActive(navBtnRoom);
      } else if (view === 'queue') {
        const isQueueOpen = panelQueue && panelQueue.classList.contains('panel-expanded');
        if (isQueueOpen && (!panelChat || panelChat.classList.contains('panel-collapsed'))) {
          applyState('home');
          return;
        }
        showPanels(false, true);
        setNavButtonActive(navBtnQueue);
      } else if (view === 'chat') {
        const isChatOpen = panelChat && panelChat.classList.contains('panel-expanded');
        if (isChatOpen && (!panelQueue || panelQueue.classList.contains('panel-collapsed'))) {
          applyState('home');
          return;
        }
        showPanels(true, false);
        setNavButtonActive(navBtnChat);
      } else if (view === 'both') {
        const bothOpen = panelChat && panelChat.classList.contains('panel-expanded') && panelQueue && panelQueue.classList.contains('panel-expanded');
        if (bothOpen) {
          applyState('home');
          return;
        }
        showPanels(true, true);
        setNavButtonActive(navBtnDJ);
      }
    }

    if (navBtnRoom) navBtnRoom.addEventListener('click', () => applyState('home'));
    if (navBtnQueue) navBtnQueue.addEventListener('click', () => applyState('queue'));
    if (navBtnChat) navBtnChat.addEventListener('click', () => applyState('chat'));
    if (navBtnDJ) navBtnDJ.addEventListener('click', () => applyState('both'));

    if (closeChatBtn) {
      closeChatBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (panelQueue && panelQueue.classList.contains('panel-expanded')) {
          applyState('queue');
        } else {
          applyState('home');
        }
      });
    }

    if (closeQueueBtn) {
      closeQueueBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (panelChat && panelChat.classList.contains('panel-expanded')) {
          applyState('chat');
        } else {
          applyState('home');
        }
      });
    }

    // Initialize in centered Room state by default
    applyState('home');
  })();
</script>
