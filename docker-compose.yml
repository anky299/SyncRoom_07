version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: syncroom_postgres
    restart: always
    environment:
      POSTGRES_USER: syncroom
      POSTGRES_PASSWORD: syncroom123
      POSTGRES_DB: syncroom_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
